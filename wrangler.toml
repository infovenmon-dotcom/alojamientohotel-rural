# Configuración de despliegue en Cloudflare Workers (flujo "Workers Builds").
# Cloudflare ejecuta `npm run build` y luego `npx wrangler deploy`, que lee esto.
name = "alojamientohotel-rural"
main = "./dist/_worker.js/index.js"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# Sirve los ficheros estáticos generados (la web) junto al SSR (panel).
[assets]
binding = "ASSETS"
directory = "./dist"

# Recordatorio: define PANEL_PASSWORD en
# el panel de Cloudflare (Settings → Variables and Secrets) o en el campo
# "Nombre/Valor de la variable" del asistente. No se commitea (regla #5).
